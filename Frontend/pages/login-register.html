<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login &amp; Register</title>

    <link rel="stylesheet" href="../css/login-register.css">
</head>

<body>

    <div class="auth" id="auth">

        <div class="forms">

            <!-- LOGIN FORM -->
            <form class="form login-form" id="loginForm">

                <h1>Đăng nhập</h1>

                <input id="email_login" type="email" placeholder="Email" required>

                <div class="password-group">
                    <input id="password_login" type="password" autocomplete="current-password" placeholder="Mật khẩu" required>
                    <button type="button" class="toggle-password" title="Hiện/ẩn mật khẩu" aria-label="Hiện/ẩn mật khẩu">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                    </button>
                </div>

                <div class="forgot" onclick="alert('Demo: Forgot Password')">
                    Quên mật khẩu?
                </div>

                <button class="submit" type="submit">
                    Đăng nhập
                </button>

                <div class="message" id="loginMessage"></div>

            </form>


            <!-- REGISTER FORM -->
            <form class="form register-form" id="registerForm">

                <h1>Đăng ký</h1>

                <input type="text" placeholder="Tên người dùng" required>

                <input type="email" placeholder="Email" required>

                <div class="password-group">
                    <input type="password" autocomplete="new-password" placeholder="Mật khẩu" minlength="6" required>
                    <button type="button" class="toggle-password" title="Hiện/ẩn mật khẩu" aria-label="Hiện/ẩn mật khẩu">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                    </button>
                </div>

                <div class="password-group">
                    <input type="password" autocomplete="new-password" placeholder="Xác nhận mật khẩu" minlength="6" required>
                    <button type="button" class="toggle-password" title="Hiện/ẩn mật khẩu" aria-label="Hiện/ẩn mật khẩu">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                    </button>
                </div>

                <button class="submit" type="submit">
                    Đăng ký
                </button>

                <div class="message" id="registerMessage"></div>

            </form>

        </div>


        <!-- SWITCH PANEL -->
        <div class="switch-panel">

            <div class="welcome welcome-login">

                <h2>Xin chào, chào mừng bạn!</h2>

                <p>Bạn chưa có tài khoản?</p>

                <button type="button" onclick="switchMode()">
                    Đăng ký
                </button>

            </div>


            <div class="welcome welcome-register">

                <h2>Chào mừng quay trở lại!</h2>

                <p>Bạn đã có tài khoản rồi?</p>

                <button type="button" onclick="switchMode()">
                    Đăng nhập
                </button>

            </div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/login-register.js"></script>
</body>

</html>
