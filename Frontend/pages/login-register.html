<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login &amp; Register</title>

    <link rel="stylesheet" href="../css/login-register.css">
</head>

<body>

    <div class="auth" id="auth">

        <div class="forms">

            <!-- LOGIN FORM -->
            <form class="form login-form" id="loginForm">

                <h1>Đăng nhập</h1>

                <input type="email" placeholder="Email" required>

                <input type="password" autocomplete="current-password" placeholder="Mật khẩu" required>

                <div class="forgot" onclick="alert('Demo: Forgot Password')">
                    Quên mật khẩu?
                </div>

                <button class="submit" type="submit">
                    Đăng nhập
                </button>

                <div class="social">
                    <p>hoặc đăng nhập với nền tảng mạng xã hội</p>

                    <div class="social-icons">
                        <span>G</span>
                        <span>f</span>
                        <span>◉</span>
                        <span>in</span>
                    </div>
                </div>
                <div class="message" id="loginMessage"></div>

            </form>


            <!-- REGISTER FORM -->
            <form class="form register-form" id="registerForm">

                <h1>Đăng ký</h1>

                <input type="text" placeholder="Tên người dùng" required>

                <input type="email" placeholder="Email" required>

                <input type="password" autocomplete="new-password" placeholder="Mật khẩu" minlength="6" >

                <input type="password" autocomplete="new-password" placeholder="Xác nhận mật khẩu" minlength="6" required>

                <button class="submit" type="submit">
                    Đăng ký
                </button>

                <div class="social">
                    <p>hoặc đăng ký với nền tảng mạng xã hội</p>

                    <div class="social-icons">
                        <span>G</span>
                        <span>f</span>
                        <span>◉</span>
                        <span>in</span>
                    </div>
                </div>

                <div class="message" id="registerMessage"></div>

            </form>

        </div>


        <!-- SWITCH PANEL -->
        <div class="switch-panel">

            <div class="welcome welcome-login">

                <h2>Xin chào, chào mừng bạn!</h2>

                <p>Bạn chưa có tài khoản?</p>

                <button type="button" onclick="switchMode()">
                    Đăng ký
                </button>

            </div>


            <div class="welcome welcome-register">

                <h2>Chào mừng quay trở lại!</h2>

                <p>Bạn đã có tài khoản rồi?</p>

                <button type="button" onclick="switchMode()">
                    Đăng nhập
                </button>

            </div>

        </div>

    </div>
    <script src="../js/login-register.js"></script>
</body>

</html>
